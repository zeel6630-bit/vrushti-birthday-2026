<title>Gift 18 · Happy Birthday Vrushti Jii</title>

<style>
*{
  box-sizing:border-box;
}

html,
body{
  width:100%;
  height:100%;
  margin:0;
  overflow:hidden;
}

body{
  background:#101014;
  color:#fff;
  font-family:Arial,Helvetica,sans-serif;
  transition:background-color .6s ease;
}

.gift18-page{
  position:relative;
  width:100%;
  height:100vh;
  min-height:600px;
  overflow:hidden;
  display:flex;
  align-items:center;
  justify-content:center;
  isolation:isolate;
}

.gift18-bg{
  position:absolute;
  inset:0;
  z-index:-3;
  background:
    radial-gradient(circle at 50% 45%,rgba(255,115,140,.18),transparent 28%),
    radial-gradient(circle at 20% 20%,rgba(255,180,80,.08),transparent 25%),
    radial-gradient(circle at 80% 80%,rgba(180,80,255,.08),transparent 30%),
    #101014;
}

.glow{
  position:absolute;
  width:520px;
  height:520px;
  border-radius:50%;
  background:radial-gradient(circle,rgba(255,170,80,.12),transparent 68%);
  filter:blur(12px);
  animation:glowPulse 3s ease-in-out infinite;
  pointer-events:none;
}

@keyframes glowPulse{
  0%,100%{transform:scale(.92);opacity:.65}
  50%{transform:scale(1.08);opacity:1}
}

.stars{
  position:absolute;
  inset:0;
  overflow:hidden;
  pointer-events:none;
  z-index:-1;
}

.star{
  position:absolute;
  width:3px;
  height:3px;
  border-radius:50%;
  background:#fff;
  opacity:.55;
  animation:twinkle var(--speed) ease-in-out infinite alternate;
}

@keyframes twinkle{
  from{opacity:.15;transform:scale(.65)}
  to{opacity:.9;transform:scale(1.25)}
}

.gift-label{
  position:absolute;
  top:24px;
  left:50%;
  transform:translateX(-50%);
  z-index:30;
  padding:8px 15px;
  border:1px solid rgba(255,255,255,.14);
  border-radius:999px;
  background:rgba(0,0,0,.28);
  backdrop-filter:blur(12px);
  color:rgba(255,255,255,.7);
  font-size:11px;
  letter-spacing:2.5px;
  text-transform:uppercase;
  white-space:nowrap;
}

.cake-stage{
  position:relative;
  width:min(650px,94vw);
  height:min(720px,88vh);
  display:flex;
  align-items:center;
  justify-content:center;
}

.cake-wrap{
  position:relative;
  width:360px;
  height:620px;
  display:flex;
  align-items:center;
  justify-content:center;
}

.velas{
  background:#fff;
  border-radius:10px;
  position:absolute;
  top:222px;
  left:50%;
  margin-left:-2.4px;
  margin-top:-8.33333333px;
  width:5px;
  height:35px;
  transform:translateY(-300px);
  backface-visibility:hidden;
  animation:in 500ms 6s ease-out forwards;
  z-index:15;
}

.velas:after,
.velas:before{
  background:rgba(255,0,0,.4);
  content:"";
  position:absolute;
  width:100%;
  height:2.22222222px;
}

.velas:after{
  top:25%;
  left:0;
}

.velas:before{
  top:45%;
  left:0;
}

.fuego{
  border-radius:100%;
  position:absolute;
  top:-20px;
  left:50%;
  margin-left:-2.6px;
  width:6.66666667px;
  height:18px;
}

.fuego:nth-child(1){
  animation:fuego 2s 6.5s infinite;
}

.fuego:nth-child(2){
  animation:fuego 1.5s 6.5s infinite;
}

.fuego:nth-child(3){
  animation:fuego 1s 6.5s infinite;
}

.fuego:nth-child(4){
  animation:fuego .5s 6.5s infinite;
}

.fuego:nth-child(5){
  animation:fuego .2s 6.5s infinite;
}

@keyframes fuego{
  0%,100%{
    background:rgba(254,248,97,.5);
    box-shadow:0 0 40px 10px rgba(248,233,209,.2);
    transform:translateY(0) scale(1);
  }

  50%{
    background:rgba(255,50,0,.1);
    box-shadow:0 0 40px 20px rgba(248,233,209,.2);
    transform:translateY(-20px) scale(0);
  }
}

@keyframes in{
  to{
    transform:translateY(0);
  }
}

#cake{
  display:block;
  position:relative;
  width:300px;
  height:750px;
  overflow:visible;
  transform:translateY(30px);
}

.message{
  position:absolute;
  left:50%;
  bottom:34px;
  transform:translateX(-50%);
  z-index:25;
  width:min(700px,90vw);
  text-align:center;
  pointer-events:none;
}

.message h1{
  margin:0;
  font-size:clamp(28px,5vw,58px);
  font-weight:300;
  letter-spacing:-1.5px;
  line-height:1.05;
  text-shadow:
    0 0 15px rgba(255,120,150,.3),
    0 0 35px rgba(255,120,150,.12);
}

.message p{
  margin:10px 0 0;
  font-size:clamp(13px,2vw,17px);
  color:rgba(255,255,255,.62);
  letter-spacing:3px;
  text-transform:uppercase;
}

.replay{
  position:absolute;
  bottom:24px;
  right:24px;
  z-index:40;
  border:1px solid rgba(255,255,255,.18);
  background:rgba(15,15,20,.65);
  color:#fff;
  padding:11px 17px;
  border-radius:999px;
  font-size:12px;
  letter-spacing:1.2px;
  cursor:pointer;
  backdrop-filter:blur(10px);
  transition:.2s ease;
}

.replay:hover{
  background:rgba(255,255,255,.1);
  transform:translateY(-2px);
}

.back{
  position:absolute;
  bottom:25px;
  left:24px;
  z-index:40;
  color:rgba(255,255,255,.55);
  text-decoration:none;
  font-size:12px;
  letter-spacing:1px;
  padding:10px 14px;
  border-radius:999px;
  border:1px solid rgba(255,255,255,.1);
  background:rgba(0,0,0,.2);
  backdrop-filter:blur(10px);
}

.back:hover{
  color:#fff;
}

.confetti{
  position:absolute;
  width:6px;
  height:12px;
  top:-20px;
  left:var(--x);
  opacity:0;
  z-index:20;
  background:var(--c);
  transform:rotate(var(--r));
  animation:confettiFall var(--d) var(--delay) linear forwards;
}

@keyframes confettiFall{
  0%{
    top:-20px;
    opacity:0;
    transform:translateX(0) rotate(0deg);
  }
  10%{
    opacity:1;
  }
  100%{
    top:105%;
    opacity:0;
    transform:translateX(var(--drift)) rotate(720deg);
  }
}

@media(max-width:600px){
  .cake-stage{
    height:78vh;
  }

  .cake-wrap{
    transform:scale(.78);
  }

  .message{
    bottom:76px;
  }

  .message h1{
    font-size:31px;
  }

  .gift-label{
    top:14px;
  }

  .replay{
    bottom:16px;
    right:16px;
  }

  .back{
    bottom:16px;
    left:16px;
  }
}
</style>

<script>
(function(){

  const page = document.getElementById("gift18");
  const replay = document.getElementById("replay");
  const stars = document.getElementById("stars");

  function createStars(){

    stars.innerHTML = "";

    for(let i = 0; i < 70; i++){

      const star = document.createElement("span");

      star.className = "star";

      star.style.left = Math.random() * 100 + "%";
      star.style.top = Math.random() * 100 + "%";
      star.style.setProperty(
        "--speed",
        (1.5 + Math.random() * 3) + "s"
      );

      star.style.animationDelay =
        (-Math.random() * 4) + "s";

      stars.appendChild(star);
    }
  }

  function createConfetti(){

    page.querySelectorAll(".confetti").forEach(el => el.remove());

    const colors = [
      "#ff6b8a",
      "#ffd166",
      "#ffffff",
      "#9b8cff",
      "#7ee7c8",
      "#ff9f68"
    ];

    for(let i = 0; i < 65; i++){

      const piece = document.createElement("span");

      piece.className = "confetti";

      piece.style.setProperty(
        "--x",
        Math.random() * 100 + "%"
      );

      piece.style.setProperty(
        "--c",
        colors[Math.floor(Math.random() * colors.length)]
      );

      piece.style.setProperty(
        "--r",
        Math.random() * 360 + "deg"
      );

      piece.style.setProperty(
        "--d",
        (4 + Math.random() * 5) + "s"
      );

      piece.style.setProperty(
        "--delay",
        (5.5 + Math.random() * 4) + "s"
      );

      piece.style.setProperty(
        "--drift",
        ((Math.random() - .5) * 240) + "px"
      );

      page.appendChild(piece);
    }
  }

  function replayCake(){

    const oldCake = document.getElementById("cake");
    const oldVelas = document.querySelector(".velas");

    /*
      Replacing the SVG completely forces every SMIL
      animation back to its initial state.
    */

    const newCake = oldCake.cloneNode(true);
    oldCake.replaceWith(newCake);

    const newVelas = oldVelas.cloneNode(true);
    oldVelas.replaceWith(newVelas);

    createStars();
    createConfetti();

    /*
      Small forced reflow guarantees the CSS animation
      timeline restarts even if Replay is clicked repeatedly.
    */

    void page.offsetWidth;
  }

  replay.addEventListener("click", replayCake);

  createStars();
  createConfetti();

})();
</script>
